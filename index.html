<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日程</title>
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">日</div>
        <div>
          <h1>日程</h1>
          <p id="todayText"></p>
        </div>
      </div>

      <div class="toolbar-stack">
        <button class="primary" id="quickEventBtn" title="新建日程">＋ 新建日程</button>
        <button id="quickTodoBtn" title="新建每日待办">＋ 每日待办</button>
        <button id="quickPlanBtn" title="新建长期计划">＋ 长期计划</button>
        <button id="quickUncomfortableBtn" title="记录让我不舒服的小事">＋ 小事便签</button>
        <button id="quickThingBtn" title="记录一下想到要干的事情">＋ 想到的事</button>
      </div>

      <section class="section">
        <div class="section-title">
          <h2>概览</h2>
        </div>
        <div class="stats">
          <div class="stat">
            <b id="statEvents">0</b>
            <span>本月日程</span>
          </div>
          <div class="stat">
            <b id="statTodos">0%</b>
            <span>今日完成</span>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="section-title">
          <h2>标签</h2>
        </div>
        <div class="category-list" id="categoryList"></div>
      </section>
    </aside>

    <section class="calendar-shell">
      <header class="topbar">
        <div class="month-control">
          <button class="icon-btn" id="prevMonth" title="上个月">‹</button>
          <div class="month-title">
            <h2 id="monthTitle"></h2>
            <span id="selectedLabel"></span>
          </div>
          <button class="icon-btn" id="nextMonth" title="下个月">›</button>
        </div>
        <div class="actions">
          <button id="todayBtn" title="回到今天">今天</button>
          <button id="exportBtn" title="下载日程文件">导出 .ics</button>
          <label class="file-trigger" title="导入日程文件">
            <input type="file" id="icsInput" accept=".ics,text/calendar">
            <span>导入 .ics</span>
          </label>
          <button id="clearDoneBtn" title="清除已完成待办">清除完成</button>
        </div>
      </header>
      <div class="weekdays">
        <div>周日</div>
        <div>周一</div>
        <div>周二</div>
        <div>周三</div>
        <div>周四</div>
        <div>周五</div>
        <div>周六</div>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </section>

    <section class="details" aria-label="日程工作区">
      <header class="details-head">
        <h2 id="detailDate"></h2>
        <p id="detailSummary"></p>
      </header>
      <div class="details-body">
        <section class="section" id="eventSection">
          <div class="section-title">
            <h2>日程安排</h2>
          </div>
          <div class="module-create">
            <h3 class="subsection-title">新建日程</h3>
            <form class="form" id="eventForm">
              <label>
                标题
                <input id="eventTitle" required maxlength="80" placeholder="课程、训练、会议">
              </label>
              <div class="form-row">
                <label>
                  日期
                  <input type="date" id="eventDate" required>
                </label>
                <label>
                  标签
                  <select id="eventCategory"></select>
                </label>
              </div>
              <div class="form-row">
                <label>
                  开始
                  <input type="time" id="eventStart">
                </label>
                <label>
                  结束
                  <input type="time" id="eventEnd">
                </label>
              </div>
              <label>
                备注
                <textarea id="eventNote" maxlength="240" placeholder="地点、准备事项、链接"></textarea>
              </label>
              <button class="primary" type="submit">保存日程</button>
            </form>
          </div>
          <div class="module-list">
            <h3 class="subsection-title">已有日程</h3>
            <div class="items" id="eventList"></div>
          </div>
        </section>

        <section class="section" id="dailyTodoSection">
          <div class="section-title">
            <h2>每日任务</h2>
          </div>
          <div class="module-create">
            <h3 class="subsection-title">添加今日任务</h3>
            <form class="form" id="todoForm">
              <div class="form-actions">
                <label>
                  内容
                  <input id="todoText" required maxlength="90" placeholder="今天要完成的任务">
                </label>
                <button class="primary" type="submit">添加</button>
              </div>
              <div class="form-row">
                <label>
                  标签
                  <select id="todoCategory"></select>
                </label>
                <label>
                  迁移到
                  <input type="date" id="bulkMoveDate">
                </label>
              </div>
              <button type="button" id="moveOpenTodosBtn">迁移未完成</button>
            </form>
          </div>
          <div class="module-list">
            <h3 class="subsection-title">今日任务列表</h3>
            <div class="items" id="todoList"></div>
          </div>
        </section>

        <section class="section" id="longPlanSection">
          <div class="section-title">
            <h2>长期计划</h2>
          </div>
          <div class="module-create">
            <h3 class="subsection-title">新建长期计划</h3>
            <form class="form" id="planForm">
              <label>
                计划
                <input id="planTitle" required maxlength="90" placeholder="考试复习、半马训练、项目交付">
              </label>
              <div class="form-row">
                <label>
                  截止日
                  <input type="date" id="planDue" required>
                </label>
                <label>
                  标签
                  <select id="planCategory"></select>
                </label>
              </div>
              <button class="primary" type="submit">保存计划</button>
            </form>
          </div>
          <div class="module-list">
            <h3 class="subsection-title">进行中的长期计划</h3>
            <div class="items" id="planList"></div>
          </div>
        </section>

        <section class="section note-section" id="uncomfortableSection">
          <div class="section-title">
            <h2>让我不舒服的小事</h2>
          </div>
          <button class="note-entry-card uncomfortable-entry" id="openUncomfortableBtn" type="button">
            <span class="note-entry-main">进入记录</span>
            <span class="note-entry-meta"><span id="uncomfortableCount">0</span> 条已保存</span>
          </button>
        </section>

        <section class="section note-section" id="quickThingsSection">
          <div class="section-title">
            <h2>一下想到要干的事情</h2>
          </div>
          <button class="note-entry-card quick-entry" id="openQuickThingBtn" type="button">
            <span class="note-entry-main">进入记录</span>
            <span class="note-entry-meta"><span id="quickThingCount">0</span> 条已保存</span>
          </button>
        </section>
      </div>
    </section>
  </main>

  <div class="note-modal" id="uncomfortableModal" aria-hidden="true">
    <div class="note-modal-panel" role="dialog" aria-modal="true" aria-labelledby="uncomfortableModalTitle">
      <header class="note-modal-head">
        <div>
          <h2 id="uncomfortableModalTitle">让我不舒服的小事</h2>
          <p>保存时会自动记录日期和时间</p>
        </div>
        <button class="mini-btn" id="closeUncomfortableBtn" title="关闭" type="button">×</button>
      </header>
      <div class="note-modal-body">
        <div class="module-create">
          <h3 class="subsection-title">新建便签</h3>
          <form class="form" id="uncomfortableForm">
            <label>
              内容
              <textarea id="uncomfortableText" required maxlength="500" placeholder="把让你不舒服的小事记下来"></textarea>
            </label>
            <button class="primary" type="submit">保存记录</button>
          </form>
        </div>
        <div class="module-list">
          <h3 class="subsection-title">已保存记录</h3>
          <div class="items" id="uncomfortableList"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="note-modal" id="quickThingModal" aria-hidden="true">
    <div class="note-modal-panel" role="dialog" aria-modal="true" aria-labelledby="quickThingModalTitle">
      <header class="note-modal-head">
        <div>
          <h2 id="quickThingModalTitle">一下想到要干的事情</h2>
          <p>先收下来，之后再安排</p>
        </div>
        <button class="mini-btn" id="closeQuickThingBtn" title="关闭" type="button">×</button>
      </header>
      <div class="note-modal-body">
        <div class="module-create">
          <h3 class="subsection-title">新建便签</h3>
          <form class="form" id="quickThingForm">
            <label>
              内容
              <textarea id="quickThingText" required maxlength="500" placeholder="先记下来，之后再安排"></textarea>
            </label>
            <button class="primary" type="submit">保存记录</button>
          </form>
        </div>
        <div class="module-list">
          <h3 class="subsection-title">已保存记录</h3>
          <div class="items" id="quickThingList"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
